<!DOCTYPE html><html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"><title>ClubTableTracker · Мобайл · Карта кампании</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Fira+Sans:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--font-display:'Russo One',system-ui,sans-serif;--font-body:'Fira Sans',system-ui,-apple-system,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;--bg:#070609;--bg-raised:#0e0b12;--surface:#141018;--border:#2a1e2e;--border-brass:rgba(196,163,90,0.20);--fg:#e8dcc8;--fg-secondary:#9e8e7a;--fg-muted:#5e4e3e;--blood-red:#c4283b;--blood-on:#f0e8d8;--brass:#c4a35a;--brass-subtle:rgba(196,163,90,0.10);--warn:#c49030;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-size:0.85rem;color:var(--fg);background:var(--bg);min-height:100vh;min-height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");background-size:256px}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(7,6,9,0.97),rgba(7,6,9,0.9));backdrop-filter:blur(12px);padding:var(--s3) var(--s4);display:flex;align-items:center;gap:var(--s3);min-height:52px;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--blood-red),transparent) 1}.topbar h1{font-family:var(--font-display);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--brass)}
.map{flex:1;position:relative;background:radial-gradient(ellipse at center,#0e0b12 0%,#070609 100%);overflow:scroll;-webkit-overflow-scrolling:touch}.map-scroll{min-width:600px;min-height:700px;position:relative}
.map-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.02) 1px,transparent 1px);background-size:20px 20px}
.map-grid::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(196,40,59,0.03) 0%,transparent 60%),radial-gradient(ellipse at 70% 60%,rgba(196,163,90,0.02) 0%,transparent 60%);pointer-events:none}
.node{position:absolute;width:94px;height:170px;transform:translate(-50%,-50%);z-index:5;cursor:pointer;transition:transform 120ms ease}
.node:active{transform:translate(-50%,-50%) scale(1.04)}.node.selected{z-index:11}
.node-inner{width:100%;height:100%;background:linear-gradient(180deg,rgba(20,16,24,0.96),rgba(10,8,12,0.97));border:2px solid var(--border);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 7px 7px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.02)}.node.selected .node-inner{border-color:var(--brass);box-shadow:0 0 14px rgba(196,163,90,0.25),0 3px 10px rgba(0,0,0,0.5),inset 0 1px 0 rgba(196,163,90,0.06)}
.node-name{font-family:var(--font-display);font-size:0.48rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--fg);line-height:1.1;text-shadow:0 1px 3px rgba(0,0,0,0.6);margin-bottom:4px;padding:0 2px;min-height:2em;display:flex;align-items:center;justify-content:center}
.inf-grid{display:flex;gap:4px;flex-shrink:0}.inf-col{display:flex;flex-direction:column;gap:3px}
.inf-cell{width:24px;height:24px;border:1px solid rgba(255,255,255,0.12);border-radius:2px}.inf-cell.on{border-color:rgba(255,255,255,0.3)}.inf-cell.off{background:rgba(255,255,255,0.03)}
.faction-marker{position:absolute;top:-2px;right:-2px;width:0;height:0;border-left:10px solid transparent;border-top:10px solid var(--border);z-index:2}
.legend{position:fixed;top:60px;right:var(--s3);background:linear-gradient(180deg,var(--surface),var(--bg-raised));border:1px solid var(--border);padding:var(--s3);z-index:20}.legend h3{font-family:var(--font-display);font-size:0.45rem;text-transform:uppercase;color:var(--brass);margin-bottom:var(--s2)}.legend-item{display:flex;align-items:center;gap:var(--s1);padding:1px 0;font-size:0.55rem}.lc{width:12px;height:12px;border:1px solid rgba(255,255,255,0.12)}
.bottom-toolbar{position:fixed;bottom:var(--s4);left:var(--s4);right:var(--s4);background:linear-gradient(180deg,var(--surface),var(--bg-raised));border:1px solid var(--border);padding:var(--s2) var(--s3);z-index:20;display:flex;gap:var(--s1);overflow-x:auto}.bottom-toolbar button{background:var(--bg);border:1px solid var(--border);color:var(--fg-secondary);font-family:var(--font-display);font-size:0.45rem;letter-spacing:0.06em;text-transform:uppercase;padding:5px 10px;cursor:pointer;flex-shrink:0;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}.bottom-toolbar .sep{width:1px;background:var(--border);margin:0 2px}
.btn{font-family:var(--font-display);font-size:0.55rem;letter-spacing:0.06em;text-transform:uppercase;padding:6px 12px;border:1px solid;cursor:pointer;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}.btn-secondary{background:var(--surface);color:var(--fg-secondary);border-color:var(--border)}
svg.conns{position:absolute;inset:0;z-index:3;pointer-events:none}svg.conns line{stroke:rgba(196,163,90,0.2);stroke-width:2;stroke-dasharray:4 3;filter:drop-shadow(0 0 2px rgba(196,163,90,0.12))}
</style></head>
<body>
<div class="topbar"><button style="background:none;border:none;color:var(--fg-muted);font-size:1.2rem;cursor:pointer;padding:4px 8px">←</button><h1>Карта · «Падение Кадии»</h1></div>
<div class="map"><div class="map-scroll">
  <div class="map-grid"></div>
  <svg class="conns" viewBox="0 0 600 700" preserveAspectRatio="none">

    <line x1="280" y1="420" x2="380" y2="530"/>

  <!-- Врата Кадии -->

  </div><div class="faction-marker" style="border-top-color:#c4283b"></div></div>

  <!-- Кузни Гелиоса -->
  <div class="node" style="left:400px;top:180px"><div class="node-inner"><div class="node-name">Кузни Гелиоса</div>
    <div class="inf-grid"><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#c4283b"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#4a9eff"></div><div class="inf-cell on" style="background:#4a9eff"></div><div class="inf-cell on" style="background:#4a9eff"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div></div></div>
  </div><div class="faction-marker" style="border-top-color:#4a9eff"></div></div>

  <!-- Пустоши -->
  <div class="node" style="left:180px;top:260px"><div class="node-inner"><div class="node-name">Пустоши</div>
    <div class="inf-grid"><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#c4283b"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell on" style="background:#c49030"></div><div class="inf-cell on" style="background:#c49030"></div><div class="inf-cell on" style="background:#c49030"></div><div class="inf-cell on" style="background:#c49030"></div></div></div>
  </div><div class="faction-marker" style="border-top-color:#c49030"></div></div>

  <!-- Шпиль Ереси -->
  <div class="node" style="left:500px;top:300px"><div class="node-inner"><div class="node-name">Шпиль Ереси</div>
    <div class="inf-grid"><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#4a9eff"></div><div class="inf-cell on" style="background:#4a9eff"></div><div class="inf-cell on" style="background:#4a9eff"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#c49030"></div><div class="inf-cell on" style="background:#c49030"></div></div></div>
  </div><div class="faction-marker" style="border-top-color:#4a9eff"></div></div>

  <!-- Равнины -->
  <div class="node" style="left:280px;top:420px"><div class="node-inner"><div class="node-name">Равнины</div>
    <div class="inf-grid"><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#c4283b"></div><div class="inf-cell on" style="background:#c4283b"></div><div class="inf-cell on" style="background:#c4283b"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#4a9eff"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#c49030"></div><div class="inf-cell on" style="background:#c49030"></div></div></div>
  </div><div class="faction-marker" style="border-top-color:#c4283b"></div></div>

  <!-- Цитадель -->
  <div class="node" style="left:100px;top:420px"><div class="node-inner"><div class="node-name">Цитадель</div>
    <div class="inf-grid"><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell on" style="background:#4a9eff"></div><div class="inf-cell on" style="background:#4a9eff"></div><div class="inf-cell on" style="background:#4a9eff"></div><div class="inf-cell on" style="background:#4a9eff"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#c49030"></div></div></div>
  </div><div class="faction-marker" style="border-top-color:#4a9eff"></div></div>

  <!-- Бастион -->
  <div class="node" style="left:380px;top:530px"><div class="node-inner"><div class="node-name">Бастион</div>
    <div class="inf-grid"><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#c4283b"></div><div class="inf-cell on" style="background:#c4283b"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell on" style="background:#4a9eff"></div><div class="inf-cell on" style="background:#4a9eff"></div><div class="inf-cell on" style="background:#4a9eff"></div></div><div class="inf-col"><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div><div class="inf-cell off"></div></div></div>
  </div><div class="faction-marker" style="border-top-color:#4a9eff"></div></div>

  <div class="legend">
    <h3>Фракции</h3><div class="legend-item"><div class="lc" style="background:#c4283b"></div>Хаос</div><div class="legend-item"><div class="lc" style="background:#4a9eff"></div>Империум</div><div class="legend-item"><div class="lc" style="background:#c49030"></div>Орки</div>
  </div>
  <div class="bottom-toolbar">
    <button>+</button><button>Связь</button><span class="sep"></span><button>Влияние</button><button>🗑</button><span class="sep"></span><button>Сброс</button>
  </div>
</div></div>
</body></html>
